# Local deployment: API (CPU) + web UI, optional Qdrant server.
#
#   docker compose up --build                      # http://localhost:8080
#   docker compose --profile qdrant up --build     # also starts Qdrant
#
# ./data is mounted read-write: build it first with the CLI (see README), or let
# the API build indexes for whatever is in the catalogue on first start.
# Model weights are cached in the `models` volume (first start downloads them).
services:
  api:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    environment:
      VS_DATA_DIR: /data
      VS_DEVICE: cpu
      VS_CORS_ORIGINS: '["http://localhost:8080"]'
      # VS_INDEX_TYPE: qdrant
      # VS_INDEX_PARAMS: '{"url": "http://qdrant:6333"}'
    volumes:
      - ./data:/data
      - ./results:/app/results:ro
      - models:/models
    ports: ["8000:8000"]
    restart: unless-stopped

  web:
    build: {context: ., dockerfile: docker/web.Dockerfile}
    depends_on: [api]
    ports: ["8080:8080"]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    profiles: [qdrant]
    volumes: [qdrant:/qdrant/storage]
    ports: ["6333:6333"]

volumes:
  models:
  qdrant:
