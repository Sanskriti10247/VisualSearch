# Serves the built UI and proxies the API on the same origin.

# Pass on the client's scheme when a TLS proxy sits in front.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Batch uploads; the API enforces the per-file and file-count limits.
    client_max_body_size 200m;
    client_body_timeout 120s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Resolve api at request time (proxy_pass with a variable), so nginx starts
    # without it and follows a recreated container's new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 10s;
        # The first cross-encoder rerank loads BLIP: tens of seconds, more if it downloads.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location = /docs         { proxy_pass $api_upstream; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass $api_upstream; proxy_set_header Host $host; }

    # Content-hashed Vite output.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        # Revalidate index.html so a deploy shows up at once. A location's add_header
        # drops the server-level ones, hence the repeats here and in /assets/.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri /index.html;
    }
}
